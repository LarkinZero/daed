name: Build daed for Debian 13 AMD64

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daed-debian-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: '0'
      NODE_OPTIONS: --max-old-space-size=4096
      HUSKY: '0'

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential libarchive-tools
          sudo gem install fpm -v 1.15.1 --no-document

      - name: Set build version
        run: |
          echo "PACKAGE_VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION=v0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm build --filter daed
          mkdir -p dist
          cp -a apps/web/dist/. dist/

      - name: Build daed (includes dae-wing and dae core)
        env:
          GOFLAGS: -trimpath -modcacherw
          OUTPUT: bundled/daed-linux-x86_64
        run: |
          mkdir -p bundled
          make

      - name: Prepare package files
        run: |
          cp install/daed.service install/daed.desktop bundled/
          cp -a install/icons bundled/
          curl --fail --location --retry 3 -o bundled/geoip.dat \
            https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl --fail --location --retry 3 -o bundled/geosite.dat \
            https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat

      - name: Package Debian DEB using upstream scripts
        run: |
          mkdir -p output
          cd bundled
          fpm -s dir -t deb -a amd64 \
            --version "$PACKAGE_VERSION" \
            --name daed \
            --license 'MIT AGPL' \
            --url 'https://github.com/daeuniverse/daed' \
            --description 'daed, a modern dashboard for dae' \
            --maintainer 'Self build' \
            --package '../output/installer-daed-linux-x86_64.deb' \
            --after-install ../install/package_after_install.sh \
            --after-remove ../install/package_after_remove.sh \
            ./geoip.dat=/usr/share/daed/geoip.dat \
            ./geosite.dat=/usr/share/daed/geosite.dat \
            ./daed.service=/usr/lib/systemd/system/daed.service \
            ./daed.desktop=/usr/share/applications/daed.desktop \
            ./icons/16x16.png=/usr/share/icons/hicolor/16x16/apps/daed.png \
            ./icons/32x32.png=/usr/share/icons/hicolor/32x32/apps/daed.png \
            ./icons/64x64.png=/usr/share/icons/hicolor/64x64/apps/daed.png \
            ./icons/128x128.png=/usr/share/icons/hicolor/128x128/apps/daed.png \
            ./icons/256x256.png=/usr/share/icons/hicolor/256x256/apps/daed.png \
            ./icons/512x512.png=/usr/share/icons/hicolor/512x512/apps/daed.png \
            ./icons/1024x1024.png=/usr/share/icons/hicolor/1024x1024/apps/daed.png \
            ./daed-linux-x86_64=/usr/bin/daed

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: daed-debian13-amd64
          path: output/*.deb

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debian13-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" output/*.deb \
            --target "$GITHUB_SHA" \
            --title "daed Debian 13 AMD64 build ${GITHUB_RUN_NUMBER}" \
            --notes "Self-built Linux AMD64 v1 package from commit ${GITHUB_SHA}. Intended for Debian 13."
